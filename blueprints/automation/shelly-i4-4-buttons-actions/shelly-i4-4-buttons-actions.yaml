blueprint:
  name: Shelly Plus I4 – 4 Tasten-Aktionen
  description: >
    Reagiert auf 6 Ereignis-Arten (Taste runter, Taste hoch, einfach, doppelt,
    dreifach, lang) an jedem der 4 Eingänge eines Shelly Plus I4 (Gen2, RPC)
    und führt je Eingang und Ereignis-Art eine frei wählbare Aktions-Sequenz
    aus. Basiert auf der Community-Blueprint
    community.home-assistant.io/t/shelly-i4-4-buttons-actions/514527,
    mit korrigiertem Geräte-Filter (siehe Hinweis unten).
  domain: automation
  input:
    button:
      name: Shelly Plus I4 Gerät
      description: >
        Das Shelly Plus I4 Gerät, dessen 4 Eingänge ausgewertet werden sollen.

        Hinweis: Die ursprüngliche Community-Blueprint filterte per
        model: SNSN-0024X – das ist die Hersteller-SKU, nicht der Wert, den
        Home Assistant im Geräteregister als "model" führt (dort steht
        "Shelly Plus I4"). Dadurch tauchte das Gerät in der Auswahl nicht auf.
        Dieser Filter nutzt stattdessen integration + model wie im
        Geräteregister hinterlegt.
      selector:
        device:
          filter:
            - integration: shelly
              model: Shelly Plus I4
    downb1:
      name: Down Button 1
      description: Action to run when SHORT press
      default: []
      selector:
        action: {}
    upb1:
      name: up Button 1
      description: Action to run when SHORT press
      default: []
      selector:
        action: {}
    singleb1:
      name: single short press Button 1
      description: Action to run when SHORT press
      default: []
      selector:
        action: {}
    doubleb1:
      name: double short press Button 1
      description: Action to run when DOUBLE SHORT press
      default: []
      selector:
        action: {}
    tripleb1:
      name: triple short press Button 1
      description: Action to run when TRIPLE SHORT press
      default: []
